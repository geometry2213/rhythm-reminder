html<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мій Ритм</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #fdfbf7; margin: 0; overflow: hidden; height: 100vh; }
        #container { height: 95vh; width: 100vw; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="container"><canvas id="sinChart"></canvas></div>
    <script>
        const ctx = document.getElementById('sinChart').getContext('2d');
        const labels = []; const ann = []; const pers = []; const lun = [];
        const daysUkr = ['нд', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
        let start = new Date(2026, 4, 9); 

        for (let i = 0; i < 90; i++) {
            let d = new Date(start); d.setDate(start.getDate() + i);
            labels.push(`${d.getDate()}.${(d.getMonth()+1).toString().padStart(2,'0')} (${daysUkr[d.getDay()]})`);
            let dayOfYr = i + 129;
            let b = 0.6 * Math.sin(2 * Math.PI * (dayOfYr - 80) / 365);
            ann.push(b);
            pers.push(b + 0.35 * Math.cos(2 * Math.PI * (i - 6) / 33)); 
            lun.push(b + 0.25 * Math.cos(2 * Math.PI * (i - 7 + 14.75) / 29.5));
        }

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Рік', data: ann, borderColor: '#2d6a4f', borderWidth: 12, tension: 0.5, pointRadius: 0, alpha: 0.2 },
                    { label: 'Я', data: pers, borderColor: '#0077b6', borderWidth: 4, tension: 0.5, pointRadius: (c) => [6, 23, 39, 56, 72].includes(c.dataIndex) ? 8 : 0, pointBackgroundColor: '#0077b6' },
                    { label: 'Місяць', data: lun, borderColor: '#ee9b00', borderWidth: 2, tension: 0.5, pointRadius: (c) => [7, 22, 36, 51].includes(c.dataIndex) ? 6 : 0, pointBackgroundColor: '#ee9b00' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { x: { ticks: { maxRotation: 90, font: { size: 10 } } }, y: { display: false } },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
