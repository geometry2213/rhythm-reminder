<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ритм</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #fdfbf7; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #c { width: 95vw; height: 90vh; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const ctx = document.getElementById('c').getContext('2d');
        const labels = Array.from({length: 30}, (_, i) => i + 1 + ".05");
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Рік', data: labels.map((_, i) => Math.sin(i/5) * 5), borderColor: '#2d6a4f', borderWidth: 5, tension: 0.4 },
                    { label: 'Я', data: labels.map((_, i) => Math.sin(i/2) * 3), borderColor: '#0077b6', borderWidth: 3, tension: 0.4 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    </script>
</body>
</html>
